rules:
  - Read public, visible content only.
  - Never post, comment, like, follow, message, or access hidden profile data.
  - Stop on CAPTCHA, risk-control, or authentication failure.
  - Save a collection failure and send it as a failed run, never as a market decision.
  - Rotate eight high-intent searches per run instead of repeating the same search set.
  - Deduplicate canonical post URLs before analysis.
  - For every query, open Filter and select 排序依据=最新 and 发布时间=一周内 before collecting cards.
  - Exclude any post older than 30 days or with a missing, ambiguous, or future displayed date.
  - On a successful collection, nominate one concrete paid validation as today's best bet.
  - Send a CEO action email after every run.

country: Malaysia
source: RedNote
timezone: Asia/Kuala_Lumpur
schedule_interval_hours: 4
max_queries_per_run: 8
rotate_queries: true
rotation_windows: 6
max_visible_cards_per_query: 10
max_detail_opens_per_run: 12
max_evidence_age_days: 30
search_sort: newest
search_publish_time_filter: one_week
require_visible_displayed_date: true
